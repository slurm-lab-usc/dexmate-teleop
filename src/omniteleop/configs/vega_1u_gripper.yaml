# Dexexoskeleton Configuration for vega_1u_gripper
# Upper body only robot with gripper end effectors (no base, torso, or head)

# Teleoperation mode selection
teleop_mode: 'exo_joycon'

# Input handler configurations for different teleop modes
input_handlers:
  # Exoskeleton + JoyCon configuration (used when teleop_mode: "exo_joycon")
  exo_joycon:
    # Leader arms (exoskeleton) configuration
    leader_arms:
      compensate_torso_pitch: false  # No torso on upper body robot
      port: "/dev/ttyUSB0"
      baud_rate: 3000000
      left_arm:
        motor_ids: [101, 102, 103, 104, 105, 106, 107]
        motor_polarities: [1, 1, 1, -1, 1, 1, 1]
        follower_joint_names: ["L_arm_j1", "L_arm_j2", "L_arm_j3", "L_arm_j4", "L_arm_j5", "L_arm_j6", "L_arm_j7"]
      right_arm:
        motor_ids: [1, 2, 3, 4, 5, 6, 7]
        motor_polarities: [1, 1, 1, 1, 1, 1, 1]
        follower_joint_names: ["R_arm_j1", "R_arm_j2", "R_arm_j3", "R_arm_j4", "R_arm_j5", "R_arm_j6", "R_arm_j7"]

    # JoyCon-specific settings
    joycon:
      stick_deadzone: 0.3

    # Button timing configuration
    button_timings:
      default_debounce: 0.01
      stick_debounce: 0.03
      estop_hold_duration: 1.5
      exit_hold_duration: 1.0
      recording_hold_duration: 1.0
      head_toggle_duration: 1.0
      combo_grace_period: 0.1

    # Hand configuration (gripper - 2 predefined poses: open/close)
    hands:
      # Always-on proportional fine control from each JoyCon stick Y axis.
      fine_max_speed: 0.50
      fine_stick_deadzone: 0.15
      fine_max_dt: 0.10
      left:
        poses:
          open: [0.78]
          close: [0.0]
      right:
        poses:
          open: [0.78]
          close: [0.0]
  # VR device configuration (used when teleop_mode: "vr")
  vr:
    socket:
      server_url: "http://localhost:8080"
    device_type: "quest3"
    tracking_space: "standing"
    position_scale: 1.0
    position_offset: [0.0, 0.0, 0.0]
    use_relative_control: true
    sync_interval: 2.0

    # Base control settings (hold left grip trigger)
    base:
      linear_velocity: 0.5
      angular_velocity: 1.0

    # Torso control settings (hold right grip trigger)
    torso:
      sensitivity: 0.01

    # Hand configuration (gripper) - only open/close poses for VR trigger interpolation
    hands:
      left:
        poses:
          open: [0.78]
          close: [0.0]
      right:
        poses:
          open: [0.78]
          close: [0.0]

    # Button timing configuration
    button_timings:
      default_debounce: 0.05
      estop_hold_duration: 1.0
      exit_hold_duration: 2.0
      combo_grace_period: 0.1


topics:
  exo_joints: "exo/joints"
  exo_joycon: "exo/joycon"
  vr_controllers: "vr/controllers"
  robot_commands: "robot/safe_commands"
  robot_status: "robot/status"
  robot_joints: "robot/joints"
  telemetry: "robot/telemetry"
  recorder_control: "recorder/control"

# Control rates (Hz)
rates:
  input_rate: 20
  command_rate: 20
  control_rate: 100
  feedback_rate: 100

# Filter configuration
filters:
  default:
    type: "butterworth"
    cutoff_freq: 10.0
    order: 2
    alpha: 0.1

  components:
    left_arm:
      type: "butterworth"
      cutoff_freq: 3.0
      order: 2

    right_arm:
      type: "butterworth"
      cutoff_freq: 3.0
      order: 2

    left_hand:
      type: "butterworth"
      cutoff_freq: 8.0
      order: 2

    right_hand:
      type: "butterworth"
      cutoff_freq: 8.0
      order: 2

# Safety parameters
safety:
  enable_collision_check: true
  collision_padding: 0.02
  enable_joint_limits: true

# Physical robot setup
robot_setup:
  column_height: 0.0   # meters
  column_tilt: 0.0      # radians

# MDP Recorder configuration
recorder:
  enabled: true
  save_dir: "/home/zinan/workspace/data/dexmate"
  episode_prefix: "episode"
  record_rate: 20.0
  save_images: true
  image_resolution: [960, 600]
  compress_images: true
  jpeg_quality: 90
  auto_stop_on_estop: false
  num_workers: 4

  # dexdata Spec selector for the new Writer/Reader API.
  data_spec_id: vega_1u_gripper
  depth:
    min_range: 0.1
    max_range: 8.0

  # Local UVC wrist cameras published on the standard Dexmate Zenoh topics.
  wrist_camera_adapter:
    enabled: true
    left_device: "/dev/dexmate-wrist-left"
    right_device: "/dev/dexmate-wrist-right"
    capture_resolution: [1280, 720]
    output_resolution: [960, 600]
    fps: 30
    fourcc: "MJPG"
    startup_timeout_s: 5.0
    stale_frame_timeout_s: 0.25
    abort_after_s: 1.0

  # Component recording (upper body only)
  components:
    left_arm: true
    right_arm: true
    head: false       # No head
    torso: false      # No torso
    left_hand: true
    right_hand: true
    # Force-torque sensors
    left_wrist_wrench: true
    right_wrist_wrench: true
    head_left_rgb: true
    head_right_rgb: true
    head_left_depth: true
    left_wrist_rgb: true
    right_wrist_rgb: true

# Initial positions (upper body only)
init_pos:
  left_arm: [0, 0, 0, 0, 0, 0, 0]
  right_arm: [0, 0, 0, 0, 0, 0, 0]
  head: [0.5, 0.0, 0.0]
  left_hand: [0.78]
  right_hand: [0.78]
